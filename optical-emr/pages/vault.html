<!-- VAULT PAGE (injected into page-content) -->
<div id="vault-page">

  <div class="alert alert-info mb-16">
    <span>🔒</span>
    <span>The Document Vault permanently stores all invoices, batch ZIPs, claim documents and approval screenshots for compliance and audit purposes. UAE regulations require 10-year retention.</span>
  </div>

  <!-- STATS ROW -->
  <div class="stats-grid mb-16" id="vault-stats">
    <div class="stat-card"><div class="stat-label">Loading…</div><div class="stat-value">—</div></div>
  </div>

  <!-- FILTERS + SEARCH -->
  <div class="card mb-16">
    <div class="card-body" style="padding:14px 20px">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <input type="text" class="fi" id="vault-search"
          placeholder="🔍  Search by filename, description…"
          style="width:280px" oninput="debounce(loadVaultPage,300)()" />
        <select class="fi" id="vault-type-filter" style="width:180px" onchange="loadVaultPage()">
          <option value="">All Types</option>
          <option value="invoice">📄 Invoices</option>
          <option value="batch">📦 Batches</option>
          <option value="claim_doc">🗂 Claim Docs</option>
          <option value="approval">✅ Approvals</option>
        </select>
        <select class="fi" id="vault-facility-filter" style="width:200px" onchange="loadVaultPage()">
          <option value="">All Facilities</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="loadVaultPage()">🔄 Refresh</button>
        <div style="margin-left:auto;font-size:11px;color:var(--muted)" id="vault-count-label">—</div>
      </div>
    </div>
  </div>

  <!-- VIEW TOGGLE -->
  <div style="display:flex;justify-content:flex-end;margin-bottom:12px;gap:8px">
    <button class="btn btn-secondary btn-sm" id="vault-view-grid" onclick="setVaultView('grid')"
      style="background:var(--teal-light);color:var(--teal2);border-color:var(--teal-mid)">⊞ Grid</button>
    <button class="btn btn-secondary btn-sm" id="vault-view-list" onclick="setVaultView('list')">☰ List</button>
  </div>

  <!-- GRID VIEW -->
  <div class="vault-grid" id="vault-grid-view">
    <div style="grid-column:1/-1;text-align:center;padding:40px">
      <div class="spinner" style="margin:0 auto 10px"></div>
      <div class="text-muted text-sm">Loading vault…</div>
    </div>
  </div>

  <!-- LIST VIEW (hidden by default) -->
  <div id="vault-list-view" style="display:none">
    <div class="card">
      <div class="card-body" style="padding:0">
        <div class="qtw">
          <table class="qt">
            <thead>
              <tr>
                <th style="width:40px"></th>
                <th>File Name</th>
                <th>Type</th>
                <th>Description</th>
                <th>Facility</th>
                <th>Added By</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="vault-list-tbody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
let _vaultView = 'grid';

window.init_vault = async function() {
  await loadFacilityOptions('vault-facility-filter');
  await loadVaultStats();
  await loadVaultPage();
};

function setVaultView(mode) {
  _vaultView = mode;
  document.getElementById('vault-grid-view').style.display = mode === 'grid' ? '' : 'none';
  document.getElementById('vault-list-view').style.display = mode === 'list' ? '' : 'none';
  document.getElementById('vault-view-grid').style.cssText =
    mode==='grid' ? 'background:var(--teal-light);color:var(--teal2);border-color:var(--teal-mid)' : '';
  document.getElementById('vault-view-list').style.cssText =
    mode==='list' ? 'background:var(--teal-light);color:var(--teal2);border-color:var(--teal-mid)' : '';
}

async function loadVaultStats() {
  try {
    const { count: total }   = await db.from('vault_entries').select('id',{count:'exact',head:true});
    const { count: invoices }= await db.from('vault_entries').select('id',{count:'exact',head:true}).eq('entry_type','invoice');
    const { count: batches } = await db.from('vault_entries').select('id',{count:'exact',head:true}).eq('entry_type','batch');
    const { count: docs }    = await db.from('vault_entries').select('id',{count:'exact',head:true}).eq('entry_type','claim_doc');

    document.getElementById('vault-stats').innerHTML = `
      <div class="stat-card"><div class="stat-label">📁 Total Entries</div>
        <div class="stat-value">${total||0}</div></div>
      <div class="stat-card green"><div class="stat-label">🧾 Invoices</div>
        <div class="stat-value">${invoices||0}</div></div>
      <div class="stat-card blue"><div class="stat-label">📦 Batches</div>
        <div class="stat-value">${batches||0}</div></div>
      <div class="stat-card amber"><div class="stat-label">🗂 Claim Docs</div>
        <div class="stat-value">${docs||0}</div></div>
    `;
  } catch(e) { console.error(e); }
}

async function loadVaultPage() {
  const grid  = document.getElementById('vault-grid-view');
  const tbody = document.getElementById('vault-list-tbody');

  try {
    let q = db.from('vault_entries')
      .select('*, profiles(full_name), facilities(name)')
      .order('created_at', { ascending: false });

    const search = document.getElementById('vault-search')?.value?.trim();
    const type   = document.getElementById('vault-type-filter')?.value;
    const facId  = document.getElementById('vault-facility-filter')?.value;

    if (type)   q = q.eq('entry_type', type);
    if (facId)  q = q.eq('facility_id', facId);
    if (search) q = q.or(`file_name.ilike.%${search}%,description.ilike.%${search}%`);

    const { data: entries } = await q;
    document.getElementById('vault-count-label').textContent =
      `${entries?.length || 0} entr${entries?.length !== 1 ? 'ies' : 'y'}`;

    if (!entries?.length) {
      const emptyHtml = `
        <div style="grid-column:1/-1">
          <div class="empty-state">
            <div class="es-icon">🔒</div>
            <div class="es-title">No vault entries found</div>
            <div class="es-text">Documents will appear here as claims are processed</div>
          </div>
        </div>`;
      if (grid)  grid.innerHTML  = emptyHtml;
      if (tbody) tbody.innerHTML = `<tr><td colspan="8">${emptyHtml}</td></tr>`;
      return;
    }

    const icons = { invoice:'🧾', batch:'📦', claim_doc:'📄', approval:'✅', other:'📁' };
    const typeCls = { invoice:'bg2-c', batch:'bp3', claim_doc:'bt', approval:'bg2-c', other:'ba' };

    // GRID VIEW
    if (grid) {
      grid.innerHTML = entries.map(e => `
        <div class="vault-item" onclick="${e.file_url && e.file_url !== '#'
          ? `window.open('${e.file_url}','_blank')`
          : 'void(0)'
        }">
          <div class="vi-icon">${icons[e.entry_type] || '📁'}</div>
          <div class="vi-name" title="${sanitize(e.file_name||e.description||'')}">
            ${sanitize(e.file_name || 'Document')}
          </div>
          <div class="vi-meta" style="margin-top:4px">${sanitize(e.description||'')}</div>
          <div class="vi-meta text-muted">${sanitize(e.facilities?.name || 'All Facilities')}</div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
            <span class="badge vi-badge ${typeCls[e.entry_type]||'bt'}">${e.entry_type}</span>
            <span style="font-size:10px;color:var(--muted)">${fmtDate(e.created_at)}</span>
          </div>
          ${e.file_url && e.file_url !== '#'
            ? `<div style="margin-top:8px">
                <a href="${e.file_url}" target="_blank" class="btn btn-secondary btn-sm" style="font-size:10px;padding:4px 8px">
                  ⬇ Download
                </a>
               </div>`
            : `<div style="margin-top:8px;font-size:10px;color:var(--muted);font-style:italic">File pending upload</div>`
          }
        </div>
      `).join('');
    }

    // LIST VIEW
    if (tbody) {
      tbody.innerHTML = entries.map(e => `
        <tr>
          <td style="text-align:center;font-size:18px">${icons[e.entry_type]||'📁'}</td>
          <td style="font-size:12px;font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            ${sanitize(e.file_name||'—')}
          </td>
          <td><span class="badge ${typeCls[e.entry_type]||'bt'}">${e.entry_type}</span></td>
          <td style="font-size:11.5px;color:var(--muted);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            ${sanitize(e.description||'—')}
          </td>
          <td style="font-size:11.5px">${sanitize(e.facilities?.name||'All')}</td>
          <td style="font-size:11.5px;color:var(--muted)">${sanitize(e.profiles?.full_name||'System')}</td>
          <td style="font-size:11px;color:var(--muted);white-space:nowrap">${fmtDate(e.created_at)}</td>
          <td>
            ${e.file_url && e.file_url !== '#'
              ? `<a href="${e.file_url}" target="_blank" class="btn btn-secondary btn-sm">⬇ Open</a>`
              : `<span class="text-muted text-sm">Pending</span>`
            }
          </td>
        </tr>
      `).join('');
    }

  } catch(e) {
    console.error(e);
    const errHtml = `<div class="alert alert-error">Failed to load vault: ${e.message}</div>`;
    if (grid)  grid.innerHTML  = errHtml;
    if (tbody) tbody.innerHTML = `<tr><td colspan="8">${errHtml}</td></tr>`;
  }
}
</script>
